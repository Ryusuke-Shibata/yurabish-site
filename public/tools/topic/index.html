<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>話題提供トピック・ジェネレーター</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent-color: #38bdf8;
      --accent-hover: #0284c7;
      --box-bg: #0f172a;
      --border-color: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: var(--card-bg);
      width: 100%;
      max-width: 500px;
      border-radius: 16px;
      padding: 32px 24px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border-color);
      text-align: center;
    }

    h1 {
      font-size: 1.4rem;
      color: var(--text-main);
      margin-bottom: 8px;
      font-weight: 700;
    }

    .description {
      font-size: 0.85rem;
      color: var(--text-sub);
      margin-bottom: 24px;
    }

    .topic-display {
      background-color: var(--box-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 28px 16px;
      margin-bottom: 24px;
      min-height: 140px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 16px;
    }

    .words-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      width: 100%;
    }

    .word-badge {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--accent-color);
      background-color: #1e293b;
      border: 1px solid var(--border-color);
      padding: 8px 16px;
      border-radius: 8px;
      transition: transform 0.1s ease;
      word-break: break-all;
    }

    .multiply {
      font-size: 1.2rem;
      font-weight: bold;
      color: var(--text-sub);
    }

    .prompt-text {
      font-size: 0.95rem;
      color: var(--text-main);
      font-weight: 500;
      line-height: 1.4;
    }

    .generate-btn {
      background-color: var(--accent-color);
      color: #0f172a;
      border: none;
      width: 100%;
      padding: 14px;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 10px;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    .generate-btn:hover {
      background-color: var(--accent-hover);
      color: #ffffff;
    }

    .generate-btn:active {
      transform: scale(0.98);
    }

    .generate-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .shuffling .word-badge {
      opacity: 0.6;
      transform: scale(0.95);
    }

    @media (max-width: 480px) {
      .container {
        padding: 24px 16px;
      }
      .word-badge {
        font-size: 1.15rem;
        padding: 6px 12px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🎲 話題提供ジェネレーター</h1>
    <p class="description">2つのキーワードを掛け合わせて新しい思考のネタを作ります</p>

    <div class="topic-display" id="topicDisplay">
      <div class="words-wrapper">
        <span class="word-badge" id="word1">ボタンを</span>
        <span class="multiply">×</span>
        <span class="word-badge" id="word2">押してね</span>
      </div>
      <p class="prompt-text" id="promptText">どんな組み合わせが出るかな？</p>
    </div>

    <button class="generate-btn" id="generateBtn" onclick="generateTopic()">話題を生成する</button>
  </div>

  <script>
    const words = [
      "AI", "サウナ", "ビール", "睡眠", "宇宙", "ラーメン", "新幹線",
      "筋トレ", "時間術", "ゲーム", "旅", "失敗談", "未来の技術",
      "休日の過ごし方", "偏愛グッズ", "本", "映画", "お金", "人間関係",
      "猫", "秘密", "幼少期", "コンビニ商品", "理想の部屋", "自動化",
      "習慣", "自己投資", "思い出", "朝のルーティン", "ガジェット"
    ];

    const prompts = [
      "について熱く語ってみよう！",
      "を組み合わせた新しいアイデアは？",
      "の意外な共通点を考えてみよう",
      "をテーマに体験談やエピソードはある？",
      "を掛け合わせた架空のサービスを作るなら？"
    ];

    function getRandom(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    function generateTopic() {
      const display = document.getElementById('topicDisplay');
      const btn = document.getElementById('generateBtn');
      const w1Elem = document.getElementById('word1');
      const w2Elem = document.getElementById('word2');
      const promptElem = document.getElementById('promptText');

      btn.disabled = true;
      display.classList.add('shuffling');

      let count = 0;
      const timer = setInterval(() => {
        w1Elem.textContent = getRandom(words);
        w2Elem.textContent = getRandom(words);
        count++;

        if (count > 8) {
          clearInterval(timer);

          let w1 = getRandom(words);
          let w2 = getRandom(words);
          while (w1 === w2) {
            w2 = getRandom(words);
          }

          w1Elem.textContent = w1;
          w2Elem.textContent = w2;
          promptElem.textContent = getRandom(prompts);

          display.classList.remove('shuffling');
          btn.disabled = false;
        }
      }, 50);
    }
  </script>
</body>
</html>
